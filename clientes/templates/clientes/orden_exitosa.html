<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Orden Registrada - HebraTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #E7F6F2; }
        .card { border: none; border-radius: 12px; }
        h2 { color: #2C3333; }
        .badge-estado { background-color: #A5C9CA; color: #2C3333; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow p-5">
                <div class="mb-3" style="font-size: 3rem;">✅</div>
                <h2>¡Orden registrada!</h2>
                <p class="text-muted">Tu orden fue guardada en el sistema correctamente.</p>
                <hr>
                <p><strong>Número de orden:</strong> #{{ orden.idOrden }}</p>
                <p><strong>Cantidad:</strong> {{ orden.cantidad }} unidades</p>
                <p><strong>Entrega estimada:</strong> {{ orden.fechaEntregaEstimada }}</p>
                <p><strong>Estado:</strong>
                    <span class="badge badge-estado px-3 py-1 rounded-pill">{{ orden.estado }}</span>
                </p>
                <div class="d-flex gap-2 justify-content-center mt-3">
                    <a href="/clientes/registrar/" class="btn btn-outline-secondary">Nueva orden</a>
                    <a href="/clientes/mis-ordenes/" class="btn btn-primary"
                       style="background-color:#395B64; border-color:#395B64;">
                        Ver mis órdenes
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
