<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Orden - HebraTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #E7F6F2; }
        .card { border: none; border-radius: 12px; }
        .btn-primary { background-color: #395B64; border-color: #395B64; }
        .btn-primary:hover { background-color: #2C3333; border-color: #2C3333; }
        h2 { color: #2C3333; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow p-4">
                <h2 class="mb-1">Nueva Orden</h2>
                <p class="text-muted mb-4">Cliente: <strong>{{ cliente.empresa }}</strong></p>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 mt-2">
                        Registrar Orden
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
